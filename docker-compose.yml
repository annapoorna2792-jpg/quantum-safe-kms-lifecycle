version: "3.9"

services:
  # ── Backend API ────────────────────────────────────────────────────
  backend:
    build: .
    container_name: quantum-kms-api
    ports:
      - "8001:8001"          # Report uses port 8001 (§8.6)
    environment:
      - DATABASE_URL=sqlite:////app/data/quantum_kms.db
      - DEFAULT_KMS_PROVIDER=aws_kms
      - PROVIDER_MODE=auto
      - KEY_ROTATION_DAYS=365
      - ROTATION_INTERVAL_SECONDS=120
      - SECRET_KEY=docker-dev-secret-change-in-production
      - SEED_DEMO_KEY=true
      - DEFAULT_KEY_ALIAS=customer-data
      - AWS_REGION=eu-north-1
      - AWS_KMS_KEY_ALIAS=alias/quantum-safe-kms-demo
      # Set these for live AWS / Azure (leave blank for sim):
      # - AWS_KMS_KEY_ID=
      # - AZURE_VAULT_URL=
      # - AZURE_CLIENT_ID=
      # - AZURE_CLIENT_SECRET=
      # - AZURE_TENANT_ID=
    volumes:
      - kms-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (served by FastAPI static mount OR nginx) ─────────────
  frontend:
    image: nginx:alpine
    container_name: quantum-kms-ui
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kms-data:
